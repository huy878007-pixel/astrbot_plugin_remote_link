name: tests

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp
          # 测试 AstrBot 页面 API stub 不需要完整 AstrBot 依赖
          pip install -r requirements.txt || true
      - name: Python syntax check
        run: |
          python -m compileall -q main.py agent tools test
      - name: Unit tests
        run: |
          python test/test_convert.py
          python test/test_reply_images.py
          python test/test_gen_vs_fetch.py
          python test/test_cache_subfolder.py
          python test/test_capability_registry.py
          python test/test_discovery.py
          python test/test_auth.py
          python test/test_media_signature.py
          python test/test_config_migration.py
          python test/test_protocol_v2.py
          python test/test_tunnel.py
      - name: Driver / smoke tests
        run: |
          python test/test_ws_driver.py
          python test/smoke_agent.py
          python test/smoke_plugin.py
